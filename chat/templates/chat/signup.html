<!DOCTYPE html>
<html>

<head>
    <title>Signup</title>
</head>

<body>

    <h1>Create Account</h1>

    {% if messages %}

        {% for message in messages %}

            <p>{{ message }}</p>

        {% endfor %}

    {% endif %}


    <form method="POST">

        {% csrf_token %}

        <input
            type="text"
            name="username"
            placeholder="Username"
            required
        >

        <br><br>

        <input
            type="email"
            name="email"
            placeholder="Email"
            required
        >

        <br><br>

        <input
            type="password"
            name="password"
            placeholder="Password"
            required
        >

        <br><br>

        <input
            type="password"
            name="confirm_password"
            placeholder="Confirm Password"
            required
        >

        <br><br>

        <button type="submit">
            Signup
        </button>

    </form>


    <p>
        Already have an account?
        <a href="{% url 'login' %}">
            Login
        </a>
    </p>

</body>

</html>
